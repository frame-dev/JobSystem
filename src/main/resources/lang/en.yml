prefix: "<dark_gray>[<gold>Jobs</gold>]</dark_gray> "
language-name: "English"
no-permission: "<red>You don't have permission ({permission}).</red>"
players-only: "<red>This command can only be used by players.</red>"
player-not-found: "<red>Player not found.</red>"
unknown-sub: "<red>Unknown subcommand. Use /job help.</red>"
help:
  prestige: "<yellow>/job prestige</yellow> <gray>- reset at max level for a permanent XP bonus</gray>"
  boost: "<yellow>/job boost (multiplier) (minutes|off)</yellow> <gray>- global XP boost</gray>"
  header: "<gold>JobSystem commands</gold>"
  list: "<yellow>/job list</yellow> <gray>- show all jobs</gray>"
  join: "<yellow>/job join [job]</yellow> <gray>- join a job</gray>"
  leave: "<yellow>/job leave</yellow> <gray>- leave your job</gray>"
  info: "<yellow>/job info (player)</yellow> <gray>- show job, level and XP</gray>"
  benefits: "<yellow>/job benefits (job)</yellow> <gray>- show perks per level</gray>"
  top: "<yellow>/job top (job)</yellow> <gray>- leaderboard</gray>"
  lang: "<yellow>/job lang (code|auto)</yellow> <gray>- change your language</gray>"
  reload: "<yellow>/job reload</yellow> <gray>- reload config and languages</gray>"
  admin: "<yellow>/job admin [set|reset|addxp|setlevel] [player] (value)</yellow> <gray>- administration</gray>"
jobs:
  fisher: "Fisher"
  butcher: "Butcher"
  hunter: "Hunter"
  farmer: "Farmer"
  miner: "Miner"
  lumberjack: "Lumberjack"
  builder: "Builder"
  blacksmith: "Blacksmith"
  brewer: "Brewer"
list:
  header: "<gold>Available jobs:</gold>"
  entry: "<gray> - </gray><yellow>{job}</yellow>"
join:
  usage: "<red>Usage: /job join [job]</red>"
  already: "<red>You already have a job. Use /job leave first.</red>"
  unknown: "<red>Unknown job. Use /job list.</red>"
  success: "<green>You are now a <yellow>{job}</yellow>!</green>"
  cooldown: "<red>You can join a new job in {time}.</red>"
leave:
  success: "<yellow>You left your job. Your progress was reset.</yellow>"
  none: "<red>You don't have a job.</red>"
info:
  prestige: "<gold>Prestige:</gold> <yellow>{prestige}/{max}</yellow> <gray>(+{bonus}% XP)</gray>"
  none: "<red>{player} has no job.</red>"
  job: "<gold>Job:</gold> <yellow>{job}</yellow>"
  level: "<gold>Level:</gold> <yellow>{level}/{max}</yellow>"
  xp: "<gold>XP:</gold> <yellow>{xp}/{required}</yellow>"
  max: "<light_purple>Max level reached.</light_purple>"
benefits:
  none: "<red>You have no job. Use /job benefits [job] to preview one.</red>"
  header: "<gold>Perks of {job}:</gold>"
  line: "{marker}<yellow>Level {level}:</yellow> <gray>{perks}</gray>"
top:
  header: "<gold>Top {job}</gold>"
  all: "all jobs"
  entry: "<yellow>#{rank}</yellow> <white>{player}</white> <gray>- {job} Lv.{level} ({xp} XP)</gray>"
  empty: "<gray>Nobody has a job yet.</gray>"
lang:
  current: "<yellow>Your language: <white>{lang}</white></yellow>"
  available: "<yellow>Available: <white>{langs}</white> (or auto)</yellow>"
  set: "<green>Language set to <white>{lang}</white>.</green>"
  auto: "<green>Language will be detected automatically.</green>"
  unknown: "<red>Unknown language: {lang}</red>"
reload:
  done: "<green>Configuration and languages reloaded.</green>"
admin:
  usage: "<red>Usage: /job admin [set|reset|addxp|setlevel] [player] (value)</red>"
  set-usage: "<red>Usage: /job admin set [player] [job]</red>"
  value-usage: "<red>Usage: /job admin {sub} [player] [value]</red>"
  set: "<green>{player} is now a {job}.</green>"
  reset: "<green>Reset job of {player}.</green>"
  nojob: "<red>{player} has no job.</red>"
  updated: "<green>Updated {player}: level {level}, XP {xp}.</green>"
  invalid: "<red>Invalid value (levels are 1-{max}).</red>"
levelup:
  broadcast: "<gold>{player} reached level {level} as {job}!</gold>"
  chat: "<gold>{job} level up! You are now level {level}.</gold>"
  perks: "<yellow>Your perks:</yellow>"
  perk-line: "<gray> - {perk}</gray>"
  title: "<gold>Level {level}</gold>"
  subtitle: "<yellow>{job}</yellow>"
actionbar:
  progress: "<gold>{job} Lv.{level}</gold> {bar} <yellow>{xp}/{required} ({percent}%)</yellow> <gray>+{gain} XP</gray>"
  max: "<gold>{job} Lv.{level}</gold> <light_purple>MAX LEVEL</light_purple> <gray>+{gain} XP</gray>"
perk:
  treasure: "{pct}% chance to fish up treasure"
  kill-speed: "Speed for {seconds}s after killing a monster"
  auto-replant: "harvested crops are replanted automatically"
  night-vision: "Night Vision for {seconds}s after mining ore"
  tool-saver: "{pct}% chance your tool loses no durability"
  none: "No perks"
  extra-fish: "{pct}% chance to catch an extra fish"
  fast-bite: "fish bite {pct}% faster"
  bonus-xp: "+{amount} bonus XP per action"
  double-hostile: "{pct}% chance for double drops from hostile mobs"
  damage: "+{pct}% damage against monsters"
  double-animal: "{pct}% chance for double drops from animals"
  feed-kill: "restores {amount} hunger per kill"
  double-crops: "{pct}% chance for double crops when harvesting"
  feed-eat: "food restores {amount} extra hunger"
  double-ore: "{pct}% chance for double ore drops"
  haste-mine: "Haste {tier} after mining ore"
  double-logs: "{pct}% chance for double logs"
  haste-chop: "Haste {tier} after chopping logs"
  refund: "{pct}% chance a placed block is not used up"
  fall: "{pct}% less fall damage"
  fall-immune: "immune to fall damage"
  unbreaking: "{pct}% chance crafted gear gets Unbreaking {tier}"
  mending: "{pct}% chance crafted gear gets Mending"
  extra-potion: "{pct}% chance to get an extra potion"
  regen: "drinking potions grants Regeneration for {seconds}s"
prestige:
  disabled: "<red>Prestige is disabled.</red>"
  not-max: "<red>You must reach level {max} first.</red>"
  maxed: "<red>You already have the maximum prestige.</red>"
  success: "<light_purple>You prestiged! Prestige {prestige} (+{bonus}% XP). Your level was reset.</light_purple>"
boost:
  started: "<light_purple>XP boost x{multiplier} for {minutes} minutes!</light_purple>"
  ended: "<yellow>The XP boost has ended.</yellow>"
  status: "<yellow>Active boost: x{multiplier}, {time} remaining.</yellow>"
  none: "<gray>No XP boost is active.</gray>"
  stopped: "<green>XP boost stopped.</green>"
  usage: "<red>Usage: /job boost [multiplier] [minutes] or /job boost off</red>"
